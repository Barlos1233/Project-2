services:
  # Store the app's data in PostgreSQL.
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campuseats}
      POSTGRES_USER: ${POSTGRES_USER:-campuseats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campuseats-dev-password}
    # Keep database files when the container stops.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Tell Compose when PostgreSQL is ready for the web app.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5

  # Build and run the Flask website.
  web:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-campuseats}:${POSTGRES_PASSWORD:-campuseats-dev-password}@db:5432/${POSTGRES_DB:-campuseats}
      SECRET_KEY: ${SECRET_KEY:-local-development-only-change-me}
      CAMPUS_TZ: ${CAMPUS_TZ:-UTC}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-1}
    ports:
      - "5000:5000"
    # Wait until the database says it is healthy.
    depends_on:
      db:
        condition: service_healthy

  blackbox-db:
    image: postgres:16
    profiles: ["testing"]
    environment:
      POSTGRES_DB: campuseats_blackbox
      POSTGRES_USER: campuseats
      POSTGRES_PASSWORD: campuseats-blackbox-test-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 3s
      retries: 10

  blackbox-web:
    build: .
    profiles: ["testing"]
    environment:
      DATABASE_URL: postgresql+psycopg://campuseats:campuseats-blackbox-test-only@blackbox-db:5432/campuseats_blackbox
      SECRET_KEY: blackbox-test-only
      CAMPUS_TZ: UTC
      SEED_DEMO_DATA: "false"
    depends_on:
      blackbox-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 10

  selenium:
    image: selenium/standalone-chrome:4.27.0
    profiles: ["testing"]
    shm_size: 2gb
    depends_on:
      blackbox-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:4444/status"]
      interval: 3s
      timeout: 3s
      retries: 20

  test-runner:
    build: .
    profiles: ["testing"]
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      PYTHONPATH: /workspace/src
      DATABASE_URL: postgresql+psycopg://campuseats:campuseats-blackbox-test-only@blackbox-db:5432/campuseats_blackbox
      TEST_DATABASE_URL: postgresql+psycopg://campuseats:campuseats-blackbox-test-only@blackbox-db:5432/campuseats_blackbox
      CAMPUS_TZ: UTC
      SEED_DEMO_DATA: "false"
      RUN_BLACKBOX: "1"
      SELENIUM_REMOTE_URL: http://selenium:4444
      BLACKBOX_BASE_URL: http://blackbox-web:5000
    command: sh -c "pip install --quiet -r /workspace/requirements-test.txt && pytest -q /workspace/tests/test_blackbox_us2.py"
    depends_on:
      blackbox-db:
        condition: service_healthy
      blackbox-web:
        condition: service_healthy
      selenium:
        condition: service_healthy

volumes:
  postgres_data:
