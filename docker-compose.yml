services:
  # Store the app's data in PostgreSQL.
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campuseats}
      POSTGRES_USER: ${POSTGRES_USER:-campuseats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campuseats-dev-password}
    # Keep database files when the container stops.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Tell Compose when PostgreSQL is ready for the web app.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5

  # Build and run the Flask website.
  web:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-campuseats}:${POSTGRES_PASSWORD:-campuseats-dev-password}@db:5432/${POSTGRES_DB:-campuseats}
      SECRET_KEY: ${SECRET_KEY:-local-development-only-change-me}
      CAMPUS_TZ: ${CAMPUS_TZ:-UTC}
    ports:
      - "5000:5000"
    # Wait until the database says it is healthy.
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
